<tr class="dashboard-section-divider-row{% if divider_kind %} dashboard-{{ divider_kind }}-divider-row{% endif %}">
  <td colspan="10">
    <div class="dashboard-section-divider" role="separator" aria-label="{{ divider_aria }}">
      {% if divider_label %}
      <span class="dashboard-section-divider-label">{{ divider_label }}{% if divider_summary %}<span class="dashboard-section-divider-meta">{{ divider_summary.count }} job{% if divider_summary.count != 1 %}s{% endif %} · Total: {{ divider_summary.total|format_aud }}</span>{% endif %}</span>
      {% endif %}
    </div>
  </td>
</tr>
