<section class="staff-cal-week-wrap staff-cal-week-layout" aria-label="{{ portal.calendar.range_heading }}">
  <div class="staff-cal-week-scroll">
    <div class="staff-cal-week-board">
      {% for day in portal.calendar.days %}
      <div class="staff-cal-week-col{% if day.is_today %} staff-cal-week-col-today{% endif %}"
           data-date="{{ day.date_iso }}"
           role="group"
           aria-label="{{ day.weekday_label }} {{ day.day_num }}">
        <header class="staff-cal-week-col-head">
          <span class="staff-cal-week-col-label">{{ day.weekday_label }}</span>
          <span class="staff-cal-week-col-num">{{ day.day_num }}</span>
        </header>
        <div class="staff-cal-week-col-rule" aria-hidden="true"></div>
        <div class="staff-cal-week-col-body">
          {% if day.jobs %}
          {% for job in day.jobs %}
          {% include "_staff_calendar_job_week.html" %}
          {% endfor %}
          {% else %}
          <p class="staff-cal-week-empty">NO JOBS</p>
          {% endif %}
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
