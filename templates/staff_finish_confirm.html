<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a2744">
  <title>Finish job — Staff Portal</title>
  {% include '_head_icons.html' %}
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='staff_portal.css') }}">
</head>
<body class="staff-portal-page">
  <header class="site-header">
    <div class="wrap header-inner staff-portal-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <h1>Japanese Removals</h1>
          <p class="tagline">Staff Portal</p>
        </div>
      </div>
      <a class="staff-portal-logout" href="{{ url_for('staff_logout') }}">Log out</a>
    </div>
  </header>

  <main class="wrap staff-portal">
    <section class="panel staff-finish-confirm">
      <h2>Finish this job?</h2>
      <p class="staff-finish-customer">{{ job.customer_name }}</p>
      <p class="staff-finish-meta">{{ job.start_time }} · {{ job.date_display }}</p>
      {% if job.started_display %}
      <p class="staff-finish-meta">Started: {{ job.started_display }}</p>
      {% endif %}
      <form method="post" action="{{ url_for('staff_finish_job', booking_id=job.id) }}" class="staff-finish-actions">
        <input type="hidden" name="staff" value="{{ staff }}">
        <input type="hidden" name="range" value="{{ range_key }}">
        <button type="submit" class="staff-job-btn staff-job-btn-finish">Yes, finish</button>
        <a class="staff-job-btn" href="{{ url_for('staff_portal', staff=staff, range=range_key) }}">Cancel</a>
      </form>
    </section>
  </main>
</body>
</html>
