<section class="staff-cal-month-wrap" aria-label="{{ portal.calendar.month_label }}">
  <div class="staff-cal-month-scroll">
    <div class="calendar-month staff-cal-month-grid">
      <div class="calendar-weekdays">
        {% for label in portal.calendar.weekday_labels %}
        <div class="calendar-weekday">{{ label }}</div>
        {% endfor %}
      </div>
      {% for week in portal.calendar.month_grid %}
      <div class="calendar-week">
        {% for cell in week %}
        <div class="calendar-day{% if not cell.in_month %} calendar-day-outside{% endif %}{% if cell.is_today %} calendar-day-today{% endif %}{% if cell.selected %} staff-cal-day-selected{% endif %}"
             data-date="{{ cell.date_iso }}">
          <div class="calendar-day-head">
            <a class="staff-cal-day-num-link"
               href="{{ url_for('staff_portal', staff_id=portal.selected_staff_id, range='calendar', cal_view='month', year=portal.calendar.year, month=portal.calendar.month, day=cell.date_iso) }}#staff-cal-day-jobs"
               aria-label="{{ cell.date_iso }}{% if cell.has_jobs %}, {{ cell.job_count }} job{% if cell.job_count != 1 %}s{% endif %}{% endif %}">
              <span class="calendar-day-num">{{ cell.day_num }}</span>
            </a>
          </div>
          {% if cell.jobs %}
          <div class="calendar-day-body">
            {% for job in cell.jobs %}
            {% include "_staff_calendar_job.html" %}
            {% endfor %}
          </div>
          {% endif %}
        </div>
        {% endfor %}
      </div>
      {% endfor %}
    </div>
  </div>
</section>
